[project]
name = "vault"
version = "0.1.0"
description = "Terminal personal knowledge base over markdown notes"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "chromadb>=0.5",
    "dateparser>=1.2",
    "google-genai>=2.16.0",
    "markdown-it-py>=3.0",
    "python-dotenv>=1.0",
    "rapidfuzz>=3.9",
    "requests>=2.32",
    "rich>=13.7",
    "sentence-transformers>=3.0",
    "textual>=0.87",
    "watchdog>=4.0",
]

[project.scripts]
vault = "vault_cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
